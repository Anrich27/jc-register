<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Middelburg International JC Register</title>
<meta name="theme-color" content="#111111">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="JC Register">
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}body{margin:0}[hidden]{display:none!important}
/* Layout: workshop ledger in Case colours. Black top bar with a red rule; client/machine index on the left, the machine's sheet on the right; pending cards are the yellow paper. */
:root{
  --bg:#f2f2f2; --surface:#ffffff; --sunk:#f7f7f7; --ink:#141414; --muted:#5f5f5f; --line:#dcdcdc;
  --accent:#c8102e; --accent-ink:#ffffff; --accent-soft:#fbe4e8;
  --bar:#111111; --bar-ink:#ffffff; --bar-muted:#a8a8a8; --bar-field:#262626; --bar-line:#3a3a3a;
  --paper:#fbf0a6; --paper-line:#e2d374; --paper-ink:#2a2510;
  --warn:#9a5a00; --warn-soft:#fbeed6; --ok:#2e6a3a; --ok-soft:#e1f0e3;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f0f0f; --surface:#1a1a1a; --sunk:#141414; --ink:#ededed; --muted:#a3a3a3; --line:#2e2e2e;
  --accent:#ec3b52; --accent-ink:#ffffff; --accent-soft:#3a161c;
  --bar:#000000; --bar-ink:#ffffff; --bar-muted:#a8a8a8; --bar-field:#1c1c1c; --bar-line:#333333;
  --paper:#3b3519; --paper-line:#5a5126; --paper-ink:#f4ecc0;
  --warn:#f0b35a; --warn-soft:#3a2c14; --ok:#7cc48a; --ok-soft:#18301d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f0f0f; --surface:#1a1a1a; --sunk:#141414; --ink:#ededed; --muted:#a3a3a3; --line:#2e2e2e;
  --accent:#ec3b52; --accent-ink:#ffffff; --accent-soft:#3a161c;
  --bar:#000000; --bar-ink:#ffffff; --bar-muted:#a8a8a8; --bar-field:#1c1c1c; --bar-line:#333333;
  --paper:#3b3519; --paper-line:#5a5126; --paper-ink:#f4ecc0;
  --warn:#f0b35a; --warn-soft:#3a2c14; --ok:#7cc48a; --ok-soft:#18301d; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bar)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bar);color:var(--bar-ink);border-bottom:4px solid var(--accent);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;
  display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px}
.brand{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:.03em;text-transform:uppercase;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;line-height:1.1}
.brand span{background:var(--accent);color:#fff;padding:2px 8px;border-radius:3px;font-size:16px;letter-spacing:.06em}
.top .search input{background:var(--bar-field);border-color:var(--bar-line);color:var(--bar-ink)}
.top .search input::placeholder{color:var(--bar-muted)}
.top .btn:not(.review){background:transparent;color:var(--bar-ink);border-color:var(--bar-line)}
.top .btn:not(.review):hover{border-color:var(--bar-ink)}
.search{flex:1 1 240px;min-width:0;display:flex}
.search input{width:100%;padding:8px 12px;border:1px solid var(--line);border-radius:6px;background:var(--sunk)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);padding:7px 12px;border-radius:6px;font-weight:500;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.danger{color:var(--accent)}
.btn[disabled]{opacity:.5;cursor:default}
.btn.review{background:var(--paper);color:var(--paper-ink);border-color:var(--paper-line)}
.badge{display:inline-block;min-width:20px;padding:0 6px;margin-left:6px;border-radius:10px;background:var(--accent);color:var(--accent-ink);font-size:12px;text-align:center}

.wrap{display:grid;grid-template-columns:300px minmax(0,1fr);min-height:calc(100vh - 60px)}
.side{border-right:1px solid var(--line);background:var(--sunk);padding-block:12px;max-height:calc(100vh - 60px);position:sticky;top:calc(env(safe-area-inset-top,0px) + 58px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:12px;overflow:auto}
.main{padding-block:20px 48px;padding-left:24px;padding-right:max(16px,env(safe-area-inset-right,0px));min-width:0}
.label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.mlist{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:2px}
.mlist button{width:100%;text-align:left;border:0;background:transparent;padding:8px 10px;border-radius:6px;display:grid;gap:1px}
.mlist button:hover{background:var(--surface)}
.mlist button[aria-current="true"]{background:var(--surface);box-shadow:inset 3px 0 0 var(--accent)}
.mlist .c{font-weight:600}
.mlist .s{font-size:12px;color:var(--muted)}
.hit{font-size:12px;color:var(--accent)}

.sheethead{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;padding:16px 18px;background:var(--surface);border:1px solid var(--line);border-radius:8px;max-width:980px}
.sheethead dt{font-family:var(--display);font-weight:600;font-size:15px;letter-spacing:.06em;color:var(--muted)}
.sheethead dd{margin:0;font-weight:600}
.titlerow{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:14px;max-width:980px}
h1{font-family:var(--display);font-weight:700;font-size:32px;line-height:1.05;margin:0;text-wrap:balance;text-transform:uppercase;letter-spacing:.01em}
h2{font-family:var(--display);font-weight:600;font-size:22px;margin:0 0 8px;text-transform:uppercase;letter-spacing:.02em}
.sub{color:var(--muted);margin-top:4px}

.tabs{display:flex;gap:4px;margin:18px 0 0;border-bottom:1px solid var(--line);max-width:980px}
.tabs button{border:0;background:transparent;padding:9px 14px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tablebox{overflow-x:auto;max-width:980px;background:var(--surface);border:1px solid var(--line);border-top:0;border-radius:0 0 8px 8px}
table{border-collapse:collapse;width:100%;min-width:560px}
th{font-family:var(--display);font-weight:600;font-size:15px;letter-spacing:.06em;text-align:left;color:var(--bar-ink);padding:10px 12px;border-bottom:2px solid var(--accent);white-space:nowrap;background:var(--bar)}
.ptab th,.parts th{background:transparent;color:var(--muted);border-bottom:0}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
ol.det{margin:0;padding-left:18px}
.chip{display:inline-block;font-size:11px;font-weight:600;padding:1px 7px;border-radius:10px;background:var(--warn-soft);color:var(--warn);white-space:nowrap;margin-left:6px;font-family:var(--body)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.src{background:var(--sunk);color:var(--muted);border:1px solid var(--line)}
.rowact{white-space:nowrap;text-align:right}
.rowact button{border:0;background:transparent;color:var(--muted);padding:2px 6px;font-size:13px}
.rowact button:hover{color:var(--accent)}
.note a{color:var(--accent)}
.note{max-width:980px;margin:10px 0 0;color:var(--muted);font-size:13px}
.empty{max-width:560px;padding:28px;border:1px dashed var(--line);border-radius:8px;background:var(--surface)}
.empty p{margin:6px 0 0;color:var(--muted)}
.parts{margin:6px 0 2px;width:100%;min-width:0;font-size:13px}
.parts td{padding:3px 8px;border:0}
details.more summary{cursor:pointer;color:var(--accent);font-size:13px}

/* edit form */
.ed td{background:var(--sunk)}
.ed input,.ed textarea{width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:5px;background:var(--surface)}
.ed textarea{min-height:58px;resize:vertical}

/* review */
.review{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:20px;max-width:1240px}
.photo{background:var(--paper);border:1px solid var(--paper-line);border-radius:8px;padding:8px;align-self:start;position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px)}
.photo img{display:block;width:100%;border-radius:4px}
.photo .cap{font-size:12px;color:var(--paper-ink);padding:6px 4px 0;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.photo a{color:var(--paper-ink)}
.form{display:flex;flex-direction:column;gap:16px;min-width:0}
.fs{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px 12px}
.f{display:flex;flex-direction:column;gap:3px;min-width:0}
.f span{font-size:12px;color:var(--muted);font-weight:500}
.f input,.f select,.f textarea{padding:7px 9px;border:1px solid var(--line);border-radius:5px;background:var(--sunk);width:100%}
.f textarea{min-height:64px;resize:vertical}
.f.low input{border-color:var(--warn);background:var(--warn-soft)}
.flags{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.flags li{padding:8px 10px;border-radius:6px;background:var(--warn-soft);color:var(--warn);font-size:13px;font-weight:500}
.flags li.ok{background:var(--ok-soft);color:var(--ok)}
.ptab{min-width:0;width:100%}
.ptab td{padding:3px 4px;border:0}
.ptab input{padding:5px 6px;border:1px solid var(--line);border-radius:4px;background:var(--sunk);width:100%}
.ptab th{background:transparent;border:0;padding:2px 4px;font-size:13px}
.qlist{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.qlist button{width:100%;text-align:left;border:1px solid var(--paper-line);background:var(--paper);color:var(--paper-ink);padding:8px 10px;border-radius:6px}
.qlist button[aria-current="true"]{outline:2px solid var(--accent)}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.confirm{padding:10px 12px;border-radius:6px;background:var(--accent-soft);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:6px;font-weight:500;z-index:20}
.back{display:none}

@media (max-width:820px){
  .wrap{grid-template-columns:1fr}
  .side{border-right:0;border-bottom:1px solid var(--line);padding-right:max(16px,env(safe-area-inset-right,0px));max-height:none;position:static}
  .main{padding-left:max(16px,env(safe-area-inset-left,0px))}
  .wrap.has-sel .side{display:none}
  .wrap:not(.has-sel) .main{display:none}
  .back{display:inline-block;margin-bottom:10px}
  .review{grid-template-columns:1fr}
  .photo{position:static}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.lock{min-height:100vh;display:grid;place-items:center;padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--bar)}
.lockbox{width:100%;max-width:380px;background:var(--surface);border-radius:10px;padding:24px;border-top:5px solid var(--accent);display:flex;flex-direction:column;gap:14px}
.lockbox h1{font-size:26px}.lockbox input[type=password]{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:var(--sunk);font-size:16px}
.lockbox label.chk{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted)}
.err{color:var(--accent);font-size:13px;min-height:1em;margin:0}
.built{font-size:12px;color:var(--bar-muted);white-space:nowrap}
</style>
</head><body>
<div class="lock" id="lock"><form class="lockbox" id="lockForm">
 <div class="brand" style="color:var(--ink)">Middelburg International <span>JC Register</span></div>
 <p class="sub" style="margin:0">Enter the register password to open the job card history.</p>
 <input type="password" id="pw" autocomplete="current-password" placeholder="Password" aria-label="Password" required>
 <label class="chk"><input type="checkbox" id="remember"> Remember on this device</label>
 <p class="err" id="lockErr"></p>
 <button class="btn primary" id="lockBtn" type="submit">Open register</button>
</form></div>
<div id="app" hidden>
<header class="top">
  <div class="brand">Middelburg International <span>JC Register</span></div>
  <div class="search"><input id="q" type="search" placeholder="Search client, model, serial or J/C number" aria-label="Search"></div>
  <div class="actions"><span class="built" id="built"></span><button class="btn" id="lockOut" type="button">Lock</button></div>
</header>
<div class="wrap" id="wrap">
  <aside class="side" id="side"><div class="label" id="mcount">Clients</div><ul class="mlist" id="mlist"></ul></aside>
  <main class="main" id="main"></main>
</div></div>
<div class="toast" id="toast" hidden></div>
<script src="xlsx.full.min.js"></script>
<script src="app.js"></script>
</body></html>
